<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>כרטיס ברכה לאבישג</title>
  <style>
    :root{
      --bg1:#0b1020;
      --bg2:#121a33;
      --card:#0f1730cc;
      --text:#eaf0ff;
      --muted:#b7c5ff;
      --yes:#27d17c;
      --no:#ff4d6d;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,"Noto Sans Hebrew","Heebo",sans-serif;
      color:var(--text);
      background:
        radial-gradient(1200px 800px at 20% 20%, #1a2b7a55, transparent 60%),
        radial-gradient(900px 700px at 80% 10%, #1d7a7a44, transparent 55%),
        linear-gradient(180deg, var(--bg1), var(--bg2));
      overflow:hidden;
      padding:24px;
    }
    .card{
      width:min(720px, 96vw);
      border:1px solid #2a3a6b;
      border-radius:24px;
      background:linear-gradient(180deg, #0f1730dd, #0c1328dd);
      box-shadow: 0 18px 60px #00000066;
      padding:28px 22px;
      position:relative;
    }
    .title{
      font-size:clamp(22px, 3.2vw, 34px);
      margin:0 0 10px;
      letter-spacing:0.2px;
    }
    .subtitle{
      margin:0 0 22px;
      color:var(--muted);
      line-height:1.5;
      font-size:clamp(14px, 2vw, 18px);
    }
    .stage{
      position:relative;
      height:160px;
      border-radius:18px;
      border:1px dashed #2a3a6b;
      background:linear-gradient(180deg, #0a1022aa, #0a102255);
      overflow:hidden;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:14px;
    }
    .buttons{
      position:relative;
      width:100%;
      height:100%;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:18px;
    }
    button{
      border:0;
      border-radius:999px;
      padding:14px 26px;
      font-size:18px;
      cursor:pointer;
      transition: transform 140ms ease, box-shadow 140ms ease, filter 140ms ease;
      user-select:none;
      font-weight:700;
    }
    #yesBtn{
      background:linear-gradient(180deg, #35f08c, #1abf6e);
      color:#082016;
      box-shadow:0 10px 24px #00000055;
      transform-origin:center;
    }
    #yesBtn:hover{
      filter:saturate(1.05);
    }
    /* "כן" גדל כשמתקרבים */
    #yesBtn.grow{
      transform: scale(1.18);
      box-shadow:0 14px 34px #00000066;
    }

    #noBtn{
      background:linear-gradient(180deg, #ff6b86, #ff3d64);
      color:#2b0010;
      box-shadow:0 10px 24px #00000055;
      position:absolute;
      right:12%;
      top:50%;
      transform:translateY(-50%);
    }

    .hint{
      margin-top:14px;
      color:#9fb2ff;
      font-size:13px;
      opacity:0.9;
    }

    .sparkle{
      position:absolute;
      inset:-2px;
      border-radius:26px;
      pointer-events:none;
      background:
        radial-gradient(420px 120px at 15% 10%, #2dd4ff22, transparent 70%),
        radial-gradient(420px 120px at 85% 10%, #34d39922, transparent 70%),
        radial-gradient(520px 160px at 50% 120%, #a78bfa1f, transparent 70%);
      filter:blur(0.2px);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="sparkle"></div>
    <h1 class="title">שלום אבישג שרה קמחי,</h1>
    <p class="subtitle">האם תהיי הוולנטיין שלי?</p>

    <div class="stage" id="stage">
      <div class="buttons" id="buttonsArea">
        <button id="yesBtn" type="button">כן</button>
        <button id="noBtn" type="button">לא</button>
      </div>
    </div>

    <div class="hint">טיפ: נסי ללחוץ על "לא". בהצלחה עם זה.</div>
  </div>

  <script>
    const stage = document.getElementById('stage');
    const yesBtn = document.getElementById('yesBtn');
    const noBtn  = document.getElementById('noBtn');
    const area   = document.getElementById('buttonsArea');

    // מיקום התחלתי "נוח"
    placeNoButton(12, 50);

    // "כן" גדל כשמתקרבים אליו
    yesBtn.addEventListener('mouseenter', () => yesBtn.classList.add('grow'));
    yesBtn.addEventListener('mouseleave', () => yesBtn.classList.remove('grow'));

    // "לא" בורח כשמתקרבים עם העכבר (גם על hover וגם אם מתקרבים אליו)
    noBtn.addEventListener('mouseenter', dodgeNoButton);
    stage.addEventListener('mousemove', (e) => {
      const rect = noBtn.getBoundingClientRect();
      const dx = e.clientX - (rect.left + rect.width / 2);
      const dy = e.clientY - (rect.top + rect.height / 2);
      const dist = Math.hypot(dx, dy);
      if (dist < 90) dodgeNoButton();
    });

    function placeNoButton(rightPct, topPct){
      noBtn.style.right = rightPct + '%';
      noBtn.style.left = 'auto';
      noBtn.style.top = topPct + '%';
      noBtn.style.transform = 'translateY(-50%)';
    }

    function dodgeNoButton(){
      const pad = 10;

      const stageRect = stage.getBoundingClientRect();
      const btnRect   = noBtn.getBoundingClientRect();

      const maxX = stageRect.width - btnRect.width - pad * 2;
      const maxY = stageRect.height - btnRect.height - pad * 2;

      const x = pad + Math.random() * Math.max(0, maxX);
      const y = pad + Math.random() * Math.max(0, maxY);

      // משתמשים ב-left כדי להציב בתוך הבמה באופן מדויק
      noBtn.style.left = x + 'px';
      noBtn.style.right = 'auto';
      noBtn.style.top = y + 'px';
      noBtn.style.transform = 'none';
    }

    // לחיצה על "כן" פותחת חלון חדש עם קונפטי כחול-ירוק וברווזים רוקדים
    yesBtn.addEventListener('click', () => {
      const w = window.open('', '_blank', 'noopener,noreferrer,width=900,height=650');
      if (!w) {
        alert('נראה שהדפדפן חסם חלונות קופצים. אפשר לאפשר פופ-אפים ואז ללחוץ שוב על "כן".');
        return;
      }

      const html = `
<!doctype html>

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>יאאאא!</title>

      background:
        radial-gradient(900px 600px at 15% 20%, #1fc7ff44, transparent 60%),
        radial-gradient(900px 600px at 85% 25%, #34d39944, transparent 55%),
        linear-gradient(180deg, #06122a, #041024);
      color:#eaffff;
    }
    .center{
      position:absolute;
      inset:0;
      display:grid;
      place-items:center;
      text-align:center;
      padding:24px;
      z-index:2;
    }

      max-width:min(720px, 92vw);
    }
    h1{
      margin:0 0 10px;
      font-size:clamp(22px, 3.5vw, 36px);
    }
    p{
      margin:0 0 18px;
      color:#bff7ff;
      line-height:1.5;
      font-size:clamp(14px, 2.2vw, 18px);
    }
    .ducks{
      display:flex;
      gap:14px;

    .duck:nth-child(5){ animation-delay: 480ms; }

    @keyframes dance{

      75%{ transform: translateY(-8px) rotate(-3deg) scale(1.02); }
      100%{ transform: translateY(0) rotate(0deg) scale(1); }
    }

    /* קונפטי */
    .confetti{
      position:absolute;
      top:-12px;

      z-index:1;
      filter: drop-shadow(0 6px 8px #00000055);

    @keyframes fall{

        transform: translateY(120vh) rotate(520deg);

    }
  </style>
</head>
<body>
  <div class="center">
    <div class="card">
      <h1>אוקיי, זה רשמי 😄</h1>
      <p>כמו מדע טוב: ניסוי הצליח, תוצאה מובהקת, p&lt;.001.</p>
      <div class="ducks" aria-label="ברווזים רוקדים">
        <span class="duck">🦆</span>
        <span class="duck">🦆</span>
        <span class="duck">🦆</span>
        <span class="duck">🦆</span>
        <span class="duck">🦆</span>
      </div>
    </div>
  </div>

  <script>
    const colors = [
      "#34d399", "#22c55e", "#2dd4bf",
      "#38bdf8", "#22d3ee", "#60a5fa"
    ];

    const COUNT = 140;
    for (let i = 0; i < COUNT; i++){
      const c = document.createElement("div");
      c.className = "confetti";
      const sizeW = 6 + Math.random() * 10;
      const sizeH = 8 + Math.random() * 14;
      c.style.width = sizeW + "px";
      c.style.height = sizeH + "px";
      c.style.left = (Math.random() * 100) + "vw";
      c.style.background = colors[Math.floor(Math.random() * colors.length)];
      c.style.animationDuration = (2.2 + Math.random() * 3.4) + "s";
      c.style.animationDelay = (-Math.random() * 4) + "s";
      c.style.transform = "rotate(" + (Math.random() * 360) + "deg)";
      document.body.appendChild(c);
    }
  <\/script>
</body>
</html>
      `.trim();

      w.document.open();
      w.document.write(html);
      w.document.close();
    });
  </script>
</body>
</html>
